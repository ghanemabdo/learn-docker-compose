services:
  frontend:
    image: ghanemabdo/frontend:latest
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
    ports:
      - "5001:5001"
  backend:
    image: ghanemabdo/backend:latest
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
    ports:
      - "8080:8080"
